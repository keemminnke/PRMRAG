# Default configuration for consensus-based auto-labeling pipeline

# Data settings
data:
  input_format: "jsonl"  # jsonl, json, hf_dataset
  batch_size: 32
  num_workers: 4
  max_trajectory_length: 50

# RPE Labeling (Small Model)
rpe:
  model_name: "meta-llama/Llama-2-7b-hf"
  model_path: null  # Override with local path if needed
  device: "cuda"

  # Monte Carlo rollout settings
  num_rollouts: 5
  max_rollout_steps: 20
  temperature: 0.8
  top_p: 0.95

  # RPE threshold for labeling
  threshold_good: 0.8  # P_t >= 0.8 → GOOD
  threshold_bad: 0.3   # P_t <= 0.3 → BAD
  # Between: BORDERLINE

  # Efficiency
  use_cache: true
  batch_inference: true

# Judge Labeling (Large Model)
judge:
  model_name: "meta-llama/Llama-2-70b-hf"
  model_path: null
  device: "cuda"

  # Generation settings
  temperature: 0.3  # Lower for more consistent judgments
  max_tokens: 512
  top_p: 0.9

  # Retry logic for API calls
  max_retries: 3
  retry_delay: 2.0

  # Judge prompt style
  prompt_style: "versaprm"  # versaprm, genprm, custom
  include_reasoning: true

  # Evaluation criteria
  use_gold_answer: true
  use_supporting_facts: true

# Consensus Module
consensus:
  # Strategy: strict, lenient, balanced
  strategy: "strict"

  # Strict rules for consensus
  rules:
    # Case 1: Both agree it's GOOD
    positive_consensus:
      rpe: ["GOOD", "BORDERLINE"]
      judge: ["GOOD"]
      label: 1

    # Case 2: Both agree it's BAD
    negative_consensus:
      rpe: ["BAD"]
      judge: ["BAD"]
      label: 0

    # Case 3: Disagreement → Filter out
    filter_disagreement: true

  # Minimum agreement score (0-1)
  min_agreement: 0.8

  # Trajectory-level filtering
  trajectory_level: true  # If any step conflicts, discard entire trajectory

  # Confidence weighting (if using soft consensus)
  weights:
    rpe: 0.3
    judge: 0.7

# Output settings
output:
  save_individual_labels: true  # Save RPE and Judge labels separately
  save_consensus_only: true     # Save final consensus-filtered dataset
  save_metadata: true           # Include metadata (confidence, reasoning, etc.)

  format: "jsonl"
  compression: null  # null, "gzip", "bz2"

# Evaluation
evaluation:
  compute_metrics: true
  metrics:
    - "agreement_rate"
    - "coverage"
    - "label_distribution"
    - "confidence_distribution"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  log_dir: "outputs/logs"
  use_wandb: false
  wandb_project: "prmrag"

# Misc
seed: 42
